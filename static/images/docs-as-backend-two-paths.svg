<svg viewBox="0 0 1080 1110" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="1110" fill="#ffffff"/>

  <!-- Header -->
  <text x="540" y="60" text-anchor="middle" font-size="15" letter-spacing="3" font-weight="600" fill="#0d7d8a">THE FIX</text>
  <text x="540" y="104" text-anchor="middle" font-size="32" font-weight="700" fill="#16262c">One sentence. Two paths.</text>

  <!-- Source box -->
  <rect x="180" y="150" width="720" height="160" rx="16" fill="#f4f7f8" stroke="#d4dde0" stroke-width="1.5"/>
  <text x="215" y="205" font-size="22" font-weight="500" fill="#16262c">Deleting this configuration <tspan fill="#9a5a00" font-weight="700">may impact</tspan> downstream</text>
  <text x="215" y="240" font-size="22" font-weight="500" fill="#16262c">models <tspan fill="#9a5a00" font-weight="700">that depend on it</tspan>.</text>
  <text x="215" y="284" font-size="15" fill="#5b6b72">The whole warning lives in two words. Watch whether they survive.</text>

  <!-- Split arrows -->
  <path d="M 350 310 L 350 374" stroke="#9aa9ae" stroke-width="2.5" fill="none"/>
  <path d="M 350 374 l -7 -10 l 14 0 z" fill="#9aa9ae"/>
  <path d="M 730 310 L 730 374" stroke="#9aa9ae" stroke-width="2.5" fill="none"/>
  <path d="M 730 374 l -7 -10 l 14 0 z" fill="#9aa9ae"/>

  <!-- Column headers -->
  <text x="300" y="408" text-anchor="middle" font-size="16" letter-spacing="2" font-weight="700" fill="#c0344b">UNPROTECTED PROSE</text>
  <text x="780" y="408" text-anchor="middle" font-size="16" letter-spacing="2" font-weight="700" fill="#0d8a66">ENGINEERED SOURCE</text>

  <!-- LEFT PATH -->
  <rect x="120" y="436" width="360" height="66" rx="12" fill="#eef2f3" stroke="#cfd8db" stroke-width="1.5"/>
  <text x="300" y="476" text-anchor="middle" font-size="18" font-weight="500" fill="#16262c">LLM regenerates the source</text>

  <path d="M 300 502 L 300 706" stroke="#cdb0b6" stroke-width="2.5" fill="none"/>
  <path d="M 300 706 l -7 -10 l 14 0 z" fill="#cdb0b6"/>

  <rect x="110" y="720" width="380" height="158" rx="16" fill="#fdecef" stroke="#e7a9b4" stroke-width="1.5"/>
  <text x="135" y="754" font-size="13" letter-spacing="1.5" font-weight="600" fill="#a8536a">CHATBOT OUTPUT</text>
  <text x="135" y="794" font-size="20" font-weight="500" fill="#16262c">"Yes, configurations</text>
  <text x="135" y="822" font-size="20" font-weight="500" fill="#16262c">can be deleted."</text>
  <circle cx="146" cy="852" r="11" fill="#c0344b"/>
  <path d="M 141 847 L 151 857 M 151 847 L 141 857" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="166" y="858" font-size="16" font-weight="600" fill="#c0344b">Qualifier stripped</text>

  <!-- RIGHT PATH: three gates -->
  <g>
    <rect x="590" y="430" width="380" height="64" rx="12" fill="#eef4f6" stroke="#bcd0d6" stroke-width="1.5"/>
    <circle cx="624" cy="462" r="15" fill="#0d7d8a"/>
    <text x="624" y="468" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
    <text x="652" y="468" font-size="18" font-weight="500" fill="#16262c">Schema in the source</text>
  </g>
  <path d="M 780 494 L 780 502" stroke="#9ed4c0" stroke-width="2.5" fill="none"/>
  <g>
    <rect x="590" y="502" width="380" height="64" rx="12" fill="#eef4f6" stroke="#bcd0d6" stroke-width="1.5"/>
    <circle cx="624" cy="534" r="15" fill="#0d7d8a"/>
    <text x="624" y="540" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
    <text x="652" y="540" font-size="18" font-weight="500" fill="#16262c">Constraints at retrieval</text>
  </g>
  <path d="M 780 566 L 780 574" stroke="#9ed4c0" stroke-width="2.5" fill="none"/>
  <g>
    <rect x="590" y="574" width="380" height="64" rx="12" fill="#eef4f6" stroke="#bcd0d6" stroke-width="1.5"/>
    <circle cx="624" cy="606" r="15" fill="#0d7d8a"/>
    <text x="624" y="612" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
    <text x="652" y="612" font-size="18" font-weight="500" fill="#16262c">Validation downstream</text>
  </g>

  <path d="M 780 638 L 780 706" stroke="#9ed4c0" stroke-width="2.5" fill="none"/>
  <path d="M 780 706 l -7 -10 l 14 0 z" fill="#9ed4c0"/>

  <rect x="590" y="720" width="380" height="176" rx="16" fill="#e8f5f0" stroke="#9ed4c0" stroke-width="1.5"/>
  <text x="615" y="754" font-size="13" letter-spacing="1.5" font-weight="600" fill="#0d8a66">CHATBOT OUTPUT</text>
  <text x="615" y="792" font-size="18" font-weight="500" fill="#16262c">"Deleting this configuration</text>
  <text x="615" y="818" font-size="18" font-weight="500" fill="#16262c"><tspan fill="#0d8a66" font-weight="700">may impact</tspan> downstream models</text>
  <text x="615" y="844" font-size="18" font-weight="500" fill="#16262c"><tspan fill="#0d8a66" font-weight="700">that depend on it</tspan>."</text>
  <circle cx="626" cy="872" r="11" fill="#0d8a66"/>
  <path d="M 621 872 l 3.5 4 l 6 -7.5" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="646" y="878" font-size="16" font-weight="600" fill="#0d8a66">Qualifier preserved</text>

  <!-- Bottom caption -->
  <rect x="120" y="940" width="840" height="120" rx="16" fill="#f4f7f8" stroke="#d4dde0" stroke-width="1.5"/>
  <text x="540" y="990" text-anchor="middle" font-size="19" font-weight="600" fill="#16262c">Single-sourcing gave you one canonical source.</text>
  <text x="540" y="1022" text-anchor="middle" font-size="19" font-weight="500" fill="#3d4f56">The agent era needs three more things layered on top of it.</text>
</svg>
